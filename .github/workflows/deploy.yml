name: Deploy website

# Production deploy of colonelhorseriding.com:
#   GitHub Actions builds the site, then copies ONLY the production build to the
#   EC2 instance over SSH (host key pinned) and activates it there.
# Runs on every push to main, and by hand (Actions -> Deploy website -> Run workflow,
# main branch only). Checks run first; nothing is sent to the server if one fails.
#
# Repository secrets used:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   public values compiled into the site
#   EC2_HOST             IP or DNS name of the instance (must match EC2_KNOWN_HOSTS)
#   EC2_USER             SSH user (ec2-user)
#   EC2_SSH_PRIVATE_KEY  private key of a key pair used only for this deploy
#   EC2_KNOWN_HOSTS      the instance's pinned SSH host key line(s)
# Setup steps and security notes: docs/deployment/EC2_SSH_DEPLOY.md

on:
  push:
    branches: [main]
  workflow_dispatch:

# No AWS access and no OIDC token: this workflow can only read the repository.
permissions:
  contents: read

# One production deploy at a time; a newer push waits instead of cancelling a
# deploy that is already half way through.
concurrency:
  group: chr-production-deploy
  cancel-in-progress: false

env:
  WEB_ROOT: /var/www/chr
  SITE_HOST: colonelhorseriding.com

jobs:
  deploy:
    name: Check, build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Test
        run: npm test

      # The two values are public by design (they are compiled into the site) and
      # are only read by this step. Without them the build still "succeeds" but
      # the site shows "Database Not Connected", so an empty value stops the run.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is empty or missing."
              exit 1
            fi
          done
          npm run build

      - name: Verify the build output
        run: |
          set -euo pipefail
          test -s dist/index.html
          grep -q 'id="root"' dist/index.html
          ls dist/assets/*.js >/dev/null
          # A server-side credential must never end up in the browser bundle.
          if grep -rIlE 'SERVICE_ROLE_KEY|RAZORPAY_KEY_SECRET|RAZORPAY_WEBHOOK_SECRET|RESEND_API_KEY|PUSH_SEND_SECRET' dist; then
            echo "::error::A server-side secret name appears in the build output."
            exit 1
          fi
          echo "dist OK: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      - name: Package the build
        run: |
          set -euo pipefail
          # Contents of dist/ at the archive root, no ownership information.
          tar --owner=0 --group=0 --numeric-owner -czf "$RUNNER_TEMP/chr-build.tar.gz" -C dist .
          echo "ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/chr-build.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/chr-build.tar.gz"

      # Everything below talks to the server. The secrets reach the shell only as
      # environment variables, never inside the script text, and the host/user are
      # checked against a strict pattern before they are written to the SSH config.
      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          for name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY EC2_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is empty or missing. See docs/deployment/EC2_SSH_DEPLOY.md."
              exit 1
            fi
          done
          # Letters, digits, dot, colon and hyphen only, and not starting with a hyphen,
          # so neither value can smuggle in an ssh option or an extra config line.
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]] || { echo "::error::EC2_HOST has unexpected characters."; exit 1; }
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]          || { echo "::error::EC2_USER has unexpected characters."; exit 1; }

          SSH_DIR="$RUNNER_TEMP/ssh"
          mkdir -p "$SSH_DIR"
          # tr: secrets pasted from Windows often carry CRLF line endings, which ssh rejects.
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' > "$SSH_DIR/deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS"     | tr -d '\r' > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/deploy_key" "$SSH_DIR/known_hosts"

          ssh-keygen -y -f "$SSH_DIR/deploy_key" >/dev/null 2>&1 \
            || { echo "::error::EC2_SSH_PRIVATE_KEY is not a valid unencrypted private key."; exit 1; }
          # The pinned key must be for this exact host: no wildcards or negations.
          if awk '$1 !~ /^#/ && NF >= 3 && $1 ~ /[*?!]/ {bad=1} END {exit !bad}' "$SSH_DIR/known_hosts"; then
            echo "::error::EC2_KNOWN_HOSTS contains a wildcard host pattern; pin the specific host key."; exit 1
          fi
          ssh-keygen -F "$EC2_HOST" -f "$SSH_DIR/known_hosts" >/dev/null 2>&1 \
            || { echo "::error::EC2_KNOWN_HOSTS has no host key for EC2_HOST ($EC2_HOST)."; exit 1; }

          # Host key checking stays ON: only the pinned key is trusted (no system known_hosts).
          cat > "$SSH_DIR/config" <<EOF
          Host chr-ec2
            HostName $EC2_HOST
            User $EC2_USER
            Port 22
            IdentityFile $SSH_DIR/deploy_key
            IdentitiesOnly yes
            PreferredAuthentications publickey
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $SSH_DIR/known_hosts
            GlobalKnownHostsFile /dev/null
            ForwardAgent no
            ForwardX11 no
            RequestTTY no
            ControlMaster no
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

          echo "SSH_CONFIG=$SSH_DIR/config" >> "$GITHUB_ENV"
          echo "REMOTE_DIR=chr-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Check the server is reachable
        run: |
          set -euo pipefail
          if ! ssh -F "$SSH_CONFIG" chr-ec2 'echo connected as "$(id -un)"; sudo -n true && echo "passwordless sudo: ok"'; then
            cat >&2 <<'MSG'
          ::error::Could not log in to the server over SSH (or the user has no passwordless sudo).
          Check: the security group allows TCP 22 from the GitHub runners; EC2_HOST is right;
          the deploy key is in ~/.ssh/authorized_keys of EC2_USER; EC2_KNOWN_HOSTS matches the
          server's current host key; EC2_USER can run `sudo -n`. See docs/deployment/EC2_SSH_DEPLOY.md.
          MSG
            exit 1
          fi

      # Runs on the server as root. Everything is validated in a staging directory
      # first; the web root is only touched once the archive is proven good, files are
      # replaced one at a time (each atomically) with index.html last, and a failed
      # check puts the previous index.html back.
      - name: Write the deploy script
        run: |
          set -euo pipefail
          {
            echo '#!/bin/bash'
            printf 'ARCHIVE_SHA256=%q\n' "$ARCHIVE_SHA256"
            printf 'WEBROOT=%q\n' "$WEB_ROOT"
            printf 'GIT_SHA=%q\n' "$GITHUB_SHA"
            printf 'RUN_ID=%q\n' "$GITHUB_RUN_ID"
            printf 'SITE_HOST=%q\n' "$SITE_HOST"
            cat <<'DEPLOY_SCRIPT'
          set -Eeuo pipefail
          umask 022

          fail() { echo "DEPLOY FAILED: $*" >&2; exit 1; }

          WORK=""
          SWAPPED=0
          on_exit() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$SWAPPED" = 1 ] && [ -n "$WORK" ] && [ -f "$WORK/index.html.prev" ]; then
              echo "Restoring the previous index.html" >&2
              cp -p "$WORK/index.html.prev" "$WEBROOT/index.html.restore.$$" \
                && mv -f "$WEBROOT/index.html.restore.$$" "$WEBROOT/index.html" \
                || echo "WARNING: could not restore the previous index.html" >&2
            fi
            [ -n "$WORK" ] && rm -rf "$WORK"
            exit "$rc"
          }
          trap on_exit EXIT

          echo "Deploying ${GIT_SHA} (workflow run ${RUN_ID}) to ${WEBROOT}"
          [ "$(id -u)" = 0 ]          || fail "the deploy script must run as root (use sudo)"
          command -v nginx >/dev/null || fail "nginx is not installed on this instance"
          [ -d "$WEBROOT" ]           || fail "$WEBROOT does not exist (it is not created by the deploy)"

          UPLOAD_DIR="$(cd "$(dirname "$0")" && pwd)"
          [ -f "$UPLOAD_DIR/chr-build.tar.gz" ] || fail "the build archive was not uploaded"

          WORK="$(mktemp -d /var/tmp/chr-deploy.XXXXXX)"
          STAGE="$WORK/stage"
          mkdir "$STAGE"

          # Work on a root-owned copy, so the uploaded file cannot change after it is checked.
          echo "--- Checking the uploaded build"
          cp "$UPLOAD_DIR/chr-build.tar.gz" "$WORK/build.tar.gz"
          echo "${ARCHIVE_SHA256}  $WORK/build.tar.gz" | sha256sum -c - >/dev/null \
            || fail "the uploaded archive does not match the checksum from the build"

          echo "--- Validating the archive"
          tar -tzf "$WORK/build.tar.gz" > "$WORK/names.txt" || fail "the archive is not a readable .tar.gz"
          [ -s "$WORK/names.txt" ] || fail "the archive is empty"
          if grep -qE '(^/|^\.\.(/|$)|/\.\.(/|$))' "$WORK/names.txt"; then
            fail "the archive contains an absolute or parent-directory path"
          fi
          # Only plain files and directories: no symlinks, hard links or devices.
          tar -tvzf "$WORK/build.tar.gz" | awk 'substr($1,1,1)!="-" && substr($1,1,1)!="d" {bad=1} END {exit bad}' \
            || fail "the archive contains something other than regular files and directories"
          tar -tvzf "$WORK/build.tar.gz" | awk '{n++; s+=$3} END {exit !(n<=20000 && s<=524288000)}' \
            || fail "the archive is unexpectedly large (over 20000 entries or 500 MB)"

          echo "--- Extracting to staging"
          tar -xzf "$WORK/build.tar.gz" -C "$STAGE" --no-same-owner --no-same-permissions
          [ -z "$(find "$STAGE" ! -type f ! -type d -print -quit)" ] || fail "staging contains a non-regular file"

          [ -s "$STAGE/index.html" ]            || fail "the build has no index.html"
          grep -q 'id="root"' "$STAGE/index.html" || fail "index.html does not look like the CHR app"
          ASSET_PATHS="$(grep -oE '/assets/[^"]+\.(js|css)' "$STAGE/index.html" | sort -u || true)"
          [ -n "$ASSET_PATHS" ] || fail "index.html does not reference any /assets/ file"
          while IFS= read -r p; do
            [ -s "$STAGE$p" ] || fail "index.html references $p but the build does not contain it"
          done <<< "$ASSET_PATHS"

          # Same owner and group as the existing web root; Nginx only needs read access.
          OWNER="$(stat -c %U "$WEBROOT")"
          GROUP="$(stat -c %G "$WEBROOT")"
          find "$STAGE" -type d -exec chmod 0755 {} +
          find "$STAGE" -type f -exec chmod 0644 {} +
          echo "Staged $(find "$STAGE" -type f | wc -l) files; web root owner is ${OWNER}:${GROUP}"

          echo "--- Deploying into ${WEBROOT}"
          if [ -f "$WEBROOT/index.html" ]; then
            cp -p "$WEBROOT/index.html" "$WORK/index.html.prev"
          fi
          SWAPPED=1
          cd "$STAGE"
          while IFS= read -r -d '' d; do
            install -d -m 0755 -o "$OWNER" -g "$GROUP" "$WEBROOT/${d#./}"
          done < <(find . -mindepth 1 -type d -print0)
          # Everything except index.html first, so the page that points at the new
          # files is switched on only after they are all in place.
          while IFS= read -r -d '' f; do
            dest="$WEBROOT/${f#./}"
            install -m 0644 -o "$OWNER" -g "$GROUP" "$f" "$dest.chr-new.$$"
            mv -f "$dest.chr-new.$$" "$dest"
          done < <(find . -type f ! -path ./index.html -print0)
          install -m 0644 -o "$OWNER" -g "$GROUP" ./index.html "$WEBROOT/index.html.chr-new.$$"
          mv -f "$WEBROOT/index.html.chr-new.$$" "$WEBROOT/index.html"
          cd /

          echo "--- Nginx"
          nginx -t || fail "nginx -t reported a configuration error; not reloading"
          systemctl is-active --quiet nginx || fail "nginx is not running"
          systemctl reload nginx || fail "nginx reload failed"

          echo "--- Health check (on this instance)"
          probe() {  # probe <path> <output file>  -> prints the HTTP status
            curl -sS -L -k --max-redirs 3 --max-time 20 \
              --resolve "${SITE_HOST}:80:127.0.0.1" --resolve "${SITE_HOST}:443:127.0.0.1" \
              -o "$2" -w '%{http_code}' "http://${SITE_HOST}$1"
          }
          code="$(probe / "$WORK/home.html")" || fail "the site did not answer on this instance"
          [ "$code" = 200 ] || fail "GET / returned HTTP $code"
          grep -q 'id="root"' "$WORK/home.html" || fail "GET / did not return the app"
          FIRST_ASSET="$(printf '%s\n' "$ASSET_PATHS" | grep '\.js$' | head -1)"
          grep -qF "$FIRST_ASSET" "$WORK/home.html" || fail "GET / is not serving the new build"
          code="$(probe "$FIRST_ASSET" /dev/null)" || fail "the new JavaScript bundle could not be fetched"
          [ "$code" = 200 ] || fail "GET $FIRST_ASSET returned HTTP $code"
          # A page route that is not a file must fall back to the app (SPA fallback).
          code="$(probe /account "$WORK/account.html")" || fail "GET /account failed"
          [ "$code" = 200 ] && grep -q 'id="root"' "$WORK/account.html" || fail "GET /account did not fall back to the app (HTTP $code)"

          # Old hashed bundles are kept for two weeks so an open tab does not break;
          # then only Vite's hashed .js/.css files in assets/ are removed.
          if [ -d "$WEBROOT/assets" ]; then
            find "$WEBROOT/assets" -regextype posix-extended -type f -mtime +14 \
              -regex '.*-[A-Za-z0-9_-]{8}\.(js|css)$' -print -delete | sed 's/^/pruned: /' || true
          fi

          SWAPPED=0
          echo "DEPLOY OK: ${GIT_SHA} is live on this instance"
          DEPLOY_SCRIPT
          } > "$RUNNER_TEMP/deploy.sh"
          bash -n "$RUNNER_TEMP/deploy.sh"
          wc -l "$RUNNER_TEMP/deploy.sh"

      - name: Upload the build
        run: |
          set -euo pipefail
          # REMOTE_DIR is "chr-deploy-<run id>-<attempt>" (digits only), created in the
          # SSH user's home directory with owner-only access.
          ssh -F "$SSH_CONFIG" chr-ec2 "umask 077 && mkdir -p -- '$REMOTE_DIR'"
          scp -F "$SSH_CONFIG" -q "$RUNNER_TEMP/chr-build.tar.gz" "$RUNNER_TEMP/deploy.sh" "chr-ec2:$REMOTE_DIR/"
          echo "Uploaded $(stat -c %s "$RUNNER_TEMP/chr-build.tar.gz") bytes to ~/$REMOTE_DIR/"

      - name: Deploy on the server
        run: |
          set -uo pipefail
          # \$HOME is left for the server's shell to expand (before sudo starts), so the
          # script is found in the SSH user's home, not root's.
          timeout 900 ssh -F "$SSH_CONFIG" chr-ec2 "sudo -n bash \"\$HOME/$REMOTE_DIR/deploy.sh\""
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Deployment failed (exit code $status). Read the output above; the live site was not changed unless it says otherwise."
            exit 1
          fi
          echo "Deployment finished successfully"

      # Always: remove what was uploaded and the key material, pass or fail.
      - name: Clean up
        if: always()
        run: |
          if [ -n "${SSH_CONFIG:-}" ] && [ -n "${REMOTE_DIR:-}" ] && [ -f "$SSH_CONFIG" ]; then
            ssh -F "$SSH_CONFIG" chr-ec2 "rm -rf -- \"\$HOME/$REMOTE_DIR\"" || echo "Could not remove ~/$REMOTE_DIR on the server (harmless; remove it by hand)"
          fi
          rm -rf "$RUNNER_TEMP/ssh" "$RUNNER_TEMP/deploy.sh" "$RUNNER_TEMP/chr-build.tar.gz"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy ${GITHUB_SHA::12}"
            echo "- Target: \`${SITE_HOST}\` web root \`${WEB_ROOT}\` (over SSH)"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
