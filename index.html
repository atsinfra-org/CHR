<!doctype html>
<html lang="en">
  <head>
    <script>
      // Always land on top on refresh — overrides the browser's own
      // scroll-position restoration, which otherwise reopens a reloaded
      // page wherever the user last scrolled to.
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      window.scrollTo(0, 0);
      // A URL hash (e.g. reloading on #riding) makes the browser jump to
      // that anchor at `load`, after the line above already ran — catch
      // that case too so a refresh always lands on top regardless of hash.
      window.addEventListener("load", () => window.scrollTo(0, 0));
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Colonel Horse Riding — a private equestrian club offering structured horse riding programs for juniors and adults." />
    <title>Colonel Horse Riding — The Art of Horse Riding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
